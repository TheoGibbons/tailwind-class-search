<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Class Search</title>
    <style>
        table { border-collapse: collapse; }
        th, td { padding :8px; outline: 1px solid #ddd; }
        tr th { background-color: rgba(249, 250, 251, 1); text-align: left; }
        input { width:100%; margin-bottom: 16px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Tailwind CSS Class Search</h1>

    <label for="search" style="display: none">Search</label>
    <input
        id="search"
        type="text"
        placeholder="Search..."
        oninput="filterResults()"
    />

    <table id="resultsTable">
        <thead>
            <tr>
                <th style="width: 50%;">Classname</th>
                <th style="width: 50%;">CSS Properties</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="js/tailwind.json.js"></script>
    <script src="js/filter.js"></script>
</body>
</html>
